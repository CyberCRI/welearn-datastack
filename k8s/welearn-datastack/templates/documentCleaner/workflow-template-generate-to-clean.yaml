{{- with .Values.documentCleaner }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .name }}-prepare-batches
spec:
  entrypoint: all
  serviceAccountName: {{ $.Values.common.workflowRbac.serviceAccountName }}
  securityContext:
    {{- include "common.security.podSecurityContext.restricted" dict | nindent 4 }}
  {{- if $.Values.common.runOnGpu }}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: gpu-node
            operator: In
            values:
            - "true"
  tolerations:
  - key: "Gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  {{- end }}
  templates:
    - name: generate-to-clean-batch
      podSpecPatch: >-
        {{ print "{\"containers\":[{\"name\":\"main\", \"resources\":{\"limits\": {\"memory\": \"{{inputs.parameters.memory}}\"}, \"requests\": {\"memory\": \"{{inputs.parameters.memory}}\"}}}]}" }}
      inputs:
        parameters:
          - name: parallelism_threshold
            default: "100000"
          - name: parallelism_max
            default: "15"
          - name: document_ids_directory
            default: document_ids
          - name: pick_qty_max
            default: 1000
          - name: memory
            default: {{ .workflowTemplates.prepareBatches.requests.memory }}
          - name: batch_ids_count_file_name
            default: "quantity.txt"
          - name: output_filename
            default: "document_ids.csv"
          - name: log_level
            default: "INFO"
      outputs:
        artifacts:
          - name: batch_ids_csv
            path: >-
              {{ printf "%s/%s/{{inputs.parameters.document_ids_directory}}" $.Values.common.artifactRoot $.Values.common.artifactOutputFolder }}
        parameters:
          - name: batch_count
            valueFrom:
              path: >-
                {{ printf "%s/%s/{{inputs.parameters.document_ids_directory}}/{{inputs.parameters.batch_ids_count_file_name}}" $.Values.common.artifactRoot $.Values.common.artifactOutputFolder }}
      container:
      {{- with $.Values.image }}
        image: {{ tpl (printf "%s/%s:%s" .repository .path .tag) $ }}
      {{- end }}
        envFrom:
          - configMapRef:
              name: {{ .name }}
        env:
          - name: ARTIFACT_ROOT
            value: {{ $.Values.common.artifactRoot }}
          - name: IS_LOCAL
            value: "0"
          - name: PARALLELISM_THRESHOLD
            value: >-
              {{ print "{{inputs.parameters.parallelism_threshold}}" }}
          - name: PICK_QTY_MAX
            value: >-
               {{ print "{{inputs.parameters.pick_qty_max }}" }}
          - name: PARALLELISM_URL_MAX
            value: {{ printf "{{inputs.parameters.parallelism_max}}" | quote }}
          - name: BATCH_URLS_DIRECTORY
            value: >-
              {{ print "{{inputs.parameters.document_ids_directory}}" }}
          - name: LOG_LEVEL
            value: >-
              {{ print "{{inputs.parameters.log_level}}" }}
          - name: OUTPUT_FILE_NAME
            value: >-
              {{ print "{{inputs.parameters.output_filename}}" }}
        args:
          - python
          - "-m"
          - welearn_datastack.nodes_workflow.DocumentCleaner.generate_to_clean_batch

        volumeMounts:
        - name: secrets
          mountPath: "/secrets"
          readOnly: true

      volumes:
      - name: secrets
        secret:
          secretName: {{ .name }}
      - name: azure-share
        csi:
          driver: file.csi.azure.com
          readOnly: true
          volumeAttributes:
            secretName: {{ $.Values.common.azureShare.secret.name }}
            shareName: {{ $.Values.common.azureShare.name }}
{{- end }}